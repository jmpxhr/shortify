<div class="link-list">
  <div class="link-list__head" aria-hidden="true">
    <span>Link</span>
    <span class="link-list__clicks">Clicks</span>
    <span>Actions</span>
  </div>

  <ul class="link-list__items">
    @for (link of links(); track link.shortCode) {
      <li class="link-row">
        <div class="link-row__main">
          <a
            class="link-row__code mono"
            [routerLink]="['/links', link.shortCode]"
            [attr.aria-label]="'View details for ' + link.shortCode"
          >
            {{ link.shortCode }}
          </a>
          <a
            class="link-row__url"
            [href]="link.originalUrl"
            target="_blank"
            rel="noopener noreferrer"
            [title]="link.originalUrl"
          >
            {{ link.originalUrl }}
          </a>
        </div>

        <div class="link-row__clicks">
          <span class="sr-only">Clicks:</span>
          {{ link.clicks }}
        </div>

        <div class="link-row__actions">
          <app-copy-button
            [text]="shortUrl(link.shortCode)"
            [label]="'Copy short link for ' + link.shortCode"
          />

          <a
            class="btn btn-sm"
            [href]="shortUrl(link.shortCode)"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'Open short link ' + link.shortCode"
          >
            Open
          </a>

          <button
            class="icon-button icon-button--danger"
            type="button"
            [attr.aria-label]="'Delete link ' + link.shortCode"
            (click)="deleteRequest.emit(link)"
          >
            <svg
              aria-hidden="true"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v5M14 11v5" />
            </svg>
          </button>
        </div>
      </li>
    }
  </ul>
</div>
