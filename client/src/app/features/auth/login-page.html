<section class="auth-shell">
  <div class="card auth-card">
    <header class="auth-card__header">
      <h1>Welcome back</h1>
      <p>Sign in to manage your short links.</p>
    </header>

    <form class="stack" novalidate (submit)="submit($event)">
      @if (errorMessage(); as message) {
        <app-error-banner [message]="message" />
      }

      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          [formField]="loginForm.username"
          [attr.aria-invalid]="usernameError() ? true : null"
          [attr.aria-describedby]="usernameError() ? 'username-error' : null"
        />
        @if (usernameError()) {
          <p id="username-error" class="field__error">{{ usernameError() }}</p>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            [formField]="loginForm.password"
            [attr.aria-invalid]="passwordError() ? true : null"
            [attr.aria-describedby]="passwordError() ? 'password-error' : null"
          />
          <button
            class="btn btn-ghost btn-sm"
            type="button"
            [attr.aria-pressed]="showPassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="togglePassword()"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (passwordError()) {
          <p id="password-error" class="field__error">{{ passwordError() }}</p>
        }
      </div>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="auth-card__footer">
      New here?
      <a routerLink="/sign-up">Create an account</a>
    </p>
  </div>
</section>
