---
# This compose-file is production only. So, it should not be called directly.
#
# Instead, it should be a part of your deployment strategy.
# This setup is supposed to be used with `docker-swarm`.
# See `./docs/pages/template/production.rst` docs.

# The json-file driver has no size limit by default,
# so rotate logs to avoid filling the host disk:
# https://docs.docker.com/engine/logging/drivers/json-file/
x-logging: &logging-production
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  web:
    <<: &web  # Image for production:
      build:
        target: production_build
        args:
          DJANGO_ENV: production

      restart: unless-stopped
      logging: *logging-production
      volumes:
        - django-media:/var/www/django/media  # since in dev it is app's folder
        - django-locale:/code/locale  # since in dev it is app's folder

    command: bash ./docker/django/gunicorn.sh
    networks:
      - proxy-net
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    logging: *logging-production
    depends_on:
      - web
    volumes:
      # Shared with the `web` service, nginx only reads them:
      - django-static:/var/www/django/static:ro
      - django-media:/var/www/django/media:ro
    networks:
      - proxy-net
    ports:
      # The only public entrypoint of the application:
      - "80:80"


networks:
  # Network for your proxy server and application to connect them,
  # do not use it for anything else!
  proxy-net:

volumes:
  django-media:
  django-locale:
