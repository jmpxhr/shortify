# Reverse proxy and static files server for the production setup.

upstream django {
    # `web` is the compose service running gunicorn on port 8000:
    server web:8000;

    # Keep connections alive between nginx and gunicorn:
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location /static/ {
        alias /var/www/django/static/;

        gzip_static on;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        try_files $uri =404;
    }

    location /media/ {
        alias /var/www/django/media/;

        expires 7d;
        add_header Cache-Control "public";
        access_log off;

        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://django;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
