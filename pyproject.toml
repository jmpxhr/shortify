[project]
name = "django-shortify"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = ["Private :: Do not Upload"]
readme = "README.md"
dependencies = [
  "django>=6.1.2,<7.0.0",
  "django-modern-rest[msgspec, openapi]>=0.16.0,<0.17.0",
  "django-stubs-ext>=6.1.2,<7.0.0",
  "django-split-settings>=1.3.2,<1.4.0",
  "django-cors-headers>=4.9.0,<5.0.0",
  "python-decouple>=3.8,<4.0",
  "punq>=0.9.0,<0.10.0",
]

[dependency-groups]
dev = [
  # Linting:
  "ruff>=0.16.10,<0.17.0",
  "import-linter>=2.15,<3.0",
  # Type checking:
  "mypy>=2.4.0,<3.0.0",
  "pyrefly>=1.3.2,<2.0.0",
  "django-stubs[compatible-mypy]>=6.1.2,<7.0.0",
  # Debug:
  "ipython>=9.17.1,<10.0.0",
  "django-debug-toolbar>=7.0.0,<8.0.0",
]

[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
package = false
add-bounds = "major"

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",        # flake8-builtins
  "ASYNC",
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "C90",      # maccabe
  "COM",      # flake8-commas
  "DTZ",      # flake8-datetimez
  "E",        # pycodestyle
  "ERA",      # flake8-eradicate
  "EXE",      # flake8-executable
  "F",        # pyflakes
  "FA",       # flake8-future-annotations
  "FBT",      # flake8-boolean-trap
  "FLY",      # pyflint
  "FURB",     # refurb
  "G",        # flake8-logging-format
  "I",        # isort
  "ICN",      # flake8-import-conventions
  "ISC",      # flake8-implicit-str-concat
  "LOG",      # flake8-logging
  "N",        # pep8-naming
  "PERF",     # perflint
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "Q",        # flake8-quotes
  "RET",      # flake8-return
  "RSE",      # flake8-raise
  "RUF",      # ruff
  "S",        # flake8-bandit
  "SIM",      # flake8-simpify
  "SLF",      # flake8-self
  "SLOT",     # flake8-slots
  "debugger", # flake8-debugger
  "TRY",      # tryceratops
  "UP",       # pyupgrade
  "W",        # pycodestyle
  "YTT",      # flake8-2020
]
ignore = [
  "missing-trailing-comma",                    # missing-trailing-comma
  "single-line-implicit-string-concatenation", # implicit string concat conflicts with `ruff format`
  "explicit-string-concatenation",             # prefer explicit string concat over implicit concat
  "magic-value-comparison",                    # do not report magic numbers
  "no-self-use",                               # do not require classmethod / staticmethod when self not used
  "raise-vanilla-args",                        # long exception messages from `tryceratops`
  "commented-out-code",                        # commented-out-code
  "non-empty-init-module",
]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"server/apps/*/migrations/*.py" = ["mutable-class-default"]
"server/implemented.py" = ["import-outside-top-level", "unused-import"]

[tool.mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
mypy_path = ["."]
explicit_package_bases = true
ignore_missing_imports = true
extra_checks = true
strict = true
strict_equality_for_none = true
warn_unreachable = true

enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]

plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "server.apps.*.migrations.*"
# Django migrations should not produce any errors (they are tested anyway):
ignore_errors = true

[tool.django-stubs]
django_settings_module = 'server.settings'
strict_settings = false

[tool.pyrefly]
# Docs: https://pyrefly.org
project-includes = ["server"]
preset = "strict"
min-severity = "warn"

[tool.pyrefly.errors]
implicit-any-attribute = false
implicit-any-empty-container = false
implicit-any-lambda = false
