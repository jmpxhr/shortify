[project]
name = "django-shortify"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = ["Private :: Do not Upload"]
readme = "README.md"
dependencies = [
  "django>=6.1.2,<7.0.0",
  "django-modern-rest[msgspec]>=0.16.0,<0.17.0",
  "django-stubs-ext>=6.1.2,<7.0.0",
  "django-split-settings>=1.3.2,<1.4.0",
  "django-cors-headers>=4.9.0,<5.0.0",
  "python-decouple>=3.8,<4.0",
  "punq>=0.9.0,<0.10.0",
]

[dependency-groups]
dev = [
  # Linting:
  "ruff>=0.16.10,<0.17.0",
  # Type checking:
  "mypy>=2.4.0,<3.0.0",
  "pyrefly>=1.3.2,<2.0.0",
  "django-stubs[compatible-mypy]>=6.1.2,<7.0.0",
  # Debug:
  "ipython>=9.17.1,<10.0.0",
  "django-debug-toolbar>=7.0.0,<8.0.0",
]

[tool.pyrefly]
preset = "strict"
project-includes = ["server/**/*.py"]

[tool.pyrefly.errors]
unbound-name = "error"
redundant-condition = "error"
no-any-return = "error"
redundant-cast = "warn"
deprecated = "error"
unused-coroutine = "error"

[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
package = false
add-bounds = "major"

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
target-version = "py314"
line-length = 80

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ASYNC",
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # maccabe
  "COM",   # flake8-commas
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FA",    # flake8-future-annotations
  "FBT",   # flake8-boolean-trap
  "FLY",   # pyflint
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simpify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF067",  # wps handles `__init__.py` logic better
  "TRY003",  # long exception messages from `tryceratops`
  "RUF105",  # we prefer `# noqa`, over `# ruff` comments
  "RUF106",  #
  "RUF201",  #
  "ERA001",  # commented-out-code
]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"server/apps/*/migrations/*.py" = ["D101", "E501", "RUF012"]
"tests/*.py" = ["S101"]


[tool.pytest.ini_options]
# pytest configuration:
# https://docs.pytest.org/en/stable/customize.html

# pytest-django configuration:
# https://pytest-django.readthedocs.io/en/latest/
DJANGO_SETTINGS_MODULE = "server.settings"

# Timeout for tests, so they can not take longer
# than this amount of seconds.
# You should adjust this value to be as low as possible.
# Configuration:
# https://pypi.org/project/pytest-timeout/
timeout = 5

# Strict `@xfail` by default:
xfail_strict = true

# Directories that are not visited by pytest collector:
norecursedirs = [
  "*.egg",
  ".eggs",
  "dist",
  "build",
  "docs",
  ".tox",
  ".git",
  "__pycache__",
  ".hypothesis",
]

# You will need to measure your tests speed with `-n auto` and without it,
# so you can see whether it gives you any performance gain, or just gives
# you an overhead. See `docs/template/development-process.rst`.
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--fail-on-template-vars",
]

# Fail on warnings:
filterwarnings = ["error"]

[tool.mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "unimported-reveal",
  "deprecated",
  "exhaustive-match",
]

explicit_package_bases = true
ignore_missing_imports = true
extra_checks = true
strict = true
strict_equality_for_none = true
warn_unreachable = true

plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "server.apps.*.migrations.*"
# Django migrations should not produce any errors (they are tested anyway):
ignore_errors = true

[tool.django-stubs]
# Docs: https://github.com/typeddjango/django-stubs
django_settings_module = "server.settings"
strict_settings = false
