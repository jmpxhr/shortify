[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 80
max-imports = 25

allowed-domain-names = data, obj

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

# Excluding generated and virtual-environment files:
extend-exclude =
  .venv
  .mypy_cache
  .ruff_cache
  .import_linter_cache

# Ignoring some errors in Django boilerplate and tests:
per-file-ignores =
  server/settings/**/*.py: WPS226, WPS407,
  server/settings/__init__.py: WPS412
  server/settings/components/__init__.py: WPS412
  server/apps/**/admin.py: WPS226
  server/apps/**/migrations/*.py: WPS102, WPS432, WPS118
  server/implemented.py: WPS202
